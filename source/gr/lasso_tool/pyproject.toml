[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradio_lasso_tool"
version = "1.0.0"
description = "Freehand lasso drawn over a Gradio gallery image"
license = "GPL-3.0-or-later"
# Third-party notices, as their licenses require, since the frontend bundles
# their code. The build strips them from it.
license-files = ["NOTICE.txt"]
requires-python = ">=3.14"
# Required by Gradio to detect a custom component.
keywords = ["gradio-custom-component"]
dependencies = ["gradio>=6.0,<7.0"]

[tool.hatch.build]
artifacts = ["/backend/gradio_lasso_tool/templates", "*.pyi"]

[tool.hatch.build.targets.wheel]
packages = ["/backend/gradio_lasso_tool"]

[tool.ruff]
extend-exclude = ["*.pyi"]

[tool.ty.src]
exclude = ["*.pyi"]
