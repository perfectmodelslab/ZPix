[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradio_maskboundingbox"
version = "0.0.1"
description = "Bounding box overlay drawn over a Gradio gallery image"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
# Required by Gradio to detect a custom component.
keywords = ["gradio-custom-component"]
dependencies = ["gradio>=6.0,<7.0"]

[tool.hatch.build]
artifacts = ["/backend/gradio_maskboundingbox/templates", "*.pyi"]

[tool.hatch.build.targets.wheel]
packages = ["/backend/gradio_maskboundingbox"]

[tool.ruff]
extend-exclude = ["*.pyi"]

[tool.ty.src]
exclude = ["*.pyi"]
